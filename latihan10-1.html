<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan 1 — Variabel dan Fungsi</title>
</head>
<body>
    <h1>Latihan 1 — Variabel dan Fungsi</h1>
    
    <script>
        // 1. Variabel const: nama lengkap dan NIM (ganti dengan data Anda)
        const namaLengkap = "Mohammad Biaz Dwi Rakhman";
        const nim = "3126521051";

        // 2. Variabel let: nilai ujian (angka)
        let nilaiUjian = 90;

        // 3. Fungsi beriNilai(skor)
        function beriNilai(skor) {
            if (skor >= 85) {
                console.log("Excellent! Nilai Anda: " + skor);
            } else if (skor >= 70) {
                console.log("Bagus! Nilai Anda: " + skor);
            } else {
                console.log("Perlu belajar lagi. Nilai Anda: " + skor);
            }
        }

        // Info identitas (opsional, boleh dihapus jika ingin output persis seperti soal)
        console.log("Nama:", namaLengkap, "| NIM:", nim);

        // 4. Panggil fungsi dengan tiga nilai berbeda
        beriNilai(nilaiUjian); // 90
        nilaiUjian = 75;
        beriNilai(nilaiUjian); // 75
        nilaiUjian = 60;
        beriNilai(nilaiUjian); // 60
    </script>
</body>
</html>
